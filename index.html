<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>A Little World of You</title>
  <meta name="description" content="A little world, made for one person.">

  <!-- Privacy: ask search engines not to index this personal page; send no referrer. -->
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">

  <meta name="theme-color" content="#FAF4E8">
  <meta name="color-scheme" content="light">

  <!-- Link-preview text (no preview image on purpose: nothing personal leaks into chat previews). -->
  <meta property="og:title" content="A Little World of You">
  <meta property="og:description" content="A little world, made for one person.">
  <meta property="og:type" content="website">

  <!-- Inline favicon: avoids a separate request (and a 404). -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FAF4E8'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23B3302F'/%3E%3C/svg%3E">

  <!-- Fonts used above the fold are preloaded. -->
  <link rel="preload" href="assets/fonts/fraunces-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/dm-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/fraunces-latin-wght-italic.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="css/style.css">

  <!-- Lets the CSS know JavaScript is running (so reveal animations never hide content without JS). -->
  <script>document.documentElement.classList.add('js');</script>
</head>
<body>
  <a class="skip-link" href="#letter">Skip to the letter</a>

  <main id="top">

    <!-- 1. WELCOME ----------------------------------------------------------->
    <section id="welcome" class="welcome" aria-labelledby="welcome-title">
      <div class="welcome__inner">
        <figure class="welcome__photo" id="welcome-photo"></figure>
        <p class="eyebrow" id="welcome-eyebrow"></p>
        <h1 class="welcome__name" id="welcome-title"></h1>
        <p class="welcome__message" id="welcome-message"></p>
        <button class="btn" id="enter-btn" type="button"></button>
      </div>
    </section>

    <!-- 2. GALLERY ----------------------------------------------------------->
    <section id="gallery" class="gallery" aria-labelledby="gallery-title">
      <header class="section-head">
        <p class="eyebrow rs" id="gallery-eyebrow"></p>
        <h2 class="section-title rs" id="gallery-title" tabindex="-1"></h2>
        <p class="section-intro rs" id="gallery-intro" hidden></p>
      </header>
      <div class="gallery__list" id="gallery-list"></div>
    </section>

    <!-- 3. LETTER ------------------------------------------------------------>
    <section id="letter" class="letter" aria-labelledby="letter-title">
      <div class="letter__inner">
        <header class="letter__head">
          <p class="eyebrow rs" id="letter-eyebrow"></p>
          <h2 class="section-title rs" id="letter-title" tabindex="-1"></h2>
          <p class="section-intro rs" id="letter-preface" hidden></p>
          <span class="rule rs" aria-hidden="true"></span>
        </header>
        <div class="letter__body" id="letter-body"></div>
        <button class="btn-quiet" id="back-to-gallery" type="button"></button>
      </div>
    </section>

    <noscript>
      <p class="noscript">This little website needs JavaScript to show its photos and letter. Please open it in a standard phone browser.</p>
    </noscript>
  </main>

  <!-- Music button: stays hidden unless music is configured in js/content.js -->
  <button class="music-toggle" id="music-toggle" type="button" hidden aria-label="Play music">
    <svg class="icon icon--play" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5.5v13l11-6.5z"/></svg>
    <svg class="icon icon--pause" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
  </button>

  <!-- Photo viewer -->
  <dialog class="lightbox" id="lightbox" aria-label="Photo viewer">
    <div class="lightbox__bar">
      <p class="lightbox__count" id="lightbox-count" aria-live="polite"></p>
      <button class="lightbox__btn" id="lightbox-close" type="button" aria-label="Close photo viewer">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="lightbox__stage" id="lightbox-stage">
      <img class="lightbox__img" id="lightbox-img" alt="" decoding="async">
    </div>
    <div class="lightbox__nav">
      <button class="lightbox__btn" id="lightbox-prev" type="button" aria-label="Previous photo">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <p class="lightbox__caption" id="lightbox-caption"></p>
      <button class="lightbox__btn" id="lightbox-next" type="button" aria-label="Next photo">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </dialog>

  <script src="js/content.js" defer></script>
  <script src="js/photo-manifest.js" defer></script>
  <script src="js/script.js" defer></script>
</body>
</html>
